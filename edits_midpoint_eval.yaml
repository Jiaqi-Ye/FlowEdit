-
    input_img: Data/Images/lighthouse.png
    source_prompt: A realistic photo of a single lighthouse tower at blue hour, centered in the same vertical composition, with warm light, blue starry sky, natural perspective, crisp architectural edges, and the original background preserved.

    target_prompts:
