    - ev_hub_scene
    - cvpr_2026_text

-
    input_img:  example_images/lighthouse.png
    source_prompt: The image features a tall white lighthouse standing prominently on a hill, with a beautiful blue sky in the background. The lighthouse is illuminated by a bright light, making it a prominent landmark in the scene.

    target_prompts:
    - A tall Big Ben clock tower standing prominently on a hill, with a beautiful blue sky and visible architectural details on the tower while preserving the overall scene composition.
    - A stone watchtower with a glowing beacon standing on the same hill at blue hour, with rich sky color gradients and crisp structural edges.

