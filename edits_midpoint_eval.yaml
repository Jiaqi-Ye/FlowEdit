-
    input_img: Data/Images/cat.png
    source_prompt: A close-up realistic photo of a small brown tabby cat sitting calmly on grass, with natural warm fur color, realistic lighting, clear facial details, and the original pose, framing, and background preserved.

    target_prompts:
    - A close-up realistic photo of a small brown and white puppy sitting calmly on grass, with natural warm fur color, realistic lighting, clear facial details, and the original pose, framing, and background preserved.

    negative_prompt: green tint, cyan tint, neon colors, oversaturated colors, cartoon, distorted face, changed background, changed pose

    target_codes:
    - cat_to_small_dog

-
    input_img: Data/Images/gas_station.png
    source_prompt: A realistic roadside gas station photo in the same desert setting, with cars, fuel pumps, bright daylight, original camera viewpoint, and a large rectangular sign that clearly reads CAFE in bold red letters.

    target_prompts:
